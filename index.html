<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 测试</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  background: #1e1e1e;
  color: #ccc;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.hidden { display: none !important; }

/* 主窗口 */
#app {
  width: 800px;
  max-width: 96vw;
  background: #ffffff;
  color: #1a1a1a;
  border: 1px solid #333;
  display: flex;
  flex-direction: column;
}
#titlebar {
  background: #0078d7;
  color: #ffffff;
  padding: 0.8rem 1.2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  user-select: none;
}
#titlebar h1 { font-size: 1.2rem; font-weight: 600; }
#titlebar span { font-size: 0.8rem; opacity: 0.9; }
#content {
  padding: 2rem 2rem 3rem;
  min-height: 380px;
}

/* 问题区 */
.question-index {
  font-size: 0.85rem;
  color: #666;
  margin-bottom: 0.8rem;
  letter-spacing: 1px;
}
.question-text {
  font-size: 1.6rem;
  font-weight: 600;
  margin-bottom: 2rem;
  color: #111;
}
.options { display: flex; flex-wrap: wrap; gap: 12px; }
.option-btn,
.action-btn {
  border: 1px solid #adadad;
  background: #e1e1e1;
  color: #000;
  padding: 0.8rem 1.6rem;
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.option-btn:hover,
.action-btn:hover {
  background: #e5f1fb;
  border-color: #0078d7;
}
.primary {
  background: #0078d7;
  border-color: #0078d7;
  color: #fff;
}
.primary:hover { background: #0067c0; border-color: #0067c0; }

input[type="text"] {
  border: 1px solid #adadad;
  padding: 0.7rem 1rem;
  font-size: 1rem;
  width: 100%;
  max-width: 460px;
  color: #111;
  background: #fff;
}
.input-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

/* 结果区 */
.result-box { text-align: center; padding: 2rem 0; }
.result-label { font-size: 1rem; color: #666; }
.result-code {
  font-size: 5rem;
  font-weight: 600;
  letter-spacing: 6px;
  color: #0078d7;
  margin: 1rem 0;
}
.share-btn { margin-top: 2rem; }

/* 禁止访问 */
#block-page {
  position: fixed;
  inset: 0;
  background: #0078d7;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  text-align: center;
  flex-direction: column;
}
#block-page .error-icon { font-size: 5rem; font-weight: 300; }
#block-page h2 { font-size: 2rem; margin: 1rem 0; }
#block-page p { font-size: 1.1rem; opacity: 0.95; margin: 0.3rem 0; }
#block-page .error-code { font-size: 0.9rem; opacity: 0.8; margin-top: 1.5rem; }
#block-page .action-btn {
  background: #fff;
  color: #0078d7;
  border-color: #fff;
  margin-top: 20px;
}

/* 模态框 */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
.modal-box {
  background: #fff;
  color: #1a1a1a;
  width: 420px;
  max-width: 90vw;
  border: 1px solid #333;
}
.modal-header {
  background: #0078d7;
  color: #fff;
  padding: 0.8rem 1.2rem;
  font-weight: 600;
}
.modal-body {
  padding: 2rem 1.5rem;
  font-size: 1rem;
  line-height: 1.5;
  white-space: pre-line;
}
.modal-footer {
  padding: 1rem;
  background: #f0f0f0;
  text-align: right;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.camera-permission {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.camera-permission .lock {
  font-weight: 600;
  background: #e1e1e1;
  padding: 0.4rem 0.7rem;
  border: 1px solid #adadad;
}
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <h1>MBTI 测试</h1>
    <span>迫真</span>
  </div>
  <div id="content"></div>
</div>

<div id="block-page" class="hidden">
  <div class="error-icon">:(</div>
  <h2>您的访问已被禁止</h2>
  <p>您已满 18 周岁，劳布斯的。</p>
  <p>请离开此页面。</p>
  <div class="error-code">错误代码：AGE_18_ACCESS_DENIED</div>
  <button class="action-btn" onclick="location.reload()">重新加载</button>
</div>

<div id="modal-overlay" class="overlay hidden">
  <div class="modal-box">
    <div class="modal-header">提示</div>
    <div class="modal-body" id="modal-message"></div>
    <div class="modal-footer">
      <button class="action-btn" id="modal-ok">确定</button>
    </div>
  </div>
</div>

<div id="camera-overlay" class="overlay hidden">
  <div class="modal-box">
    <div class="modal-header">权限请求</div>
    <div class="modal-body">
      <div class="camera-permission">
        <div class="lock">锁</div>
        <div>
          <strong>mmmm.fake</strong> 想要使用您的摄像头。<br>
          <span style="color:#666; font-size:0.9rem;">看看手肘</span>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="action-btn" id="camera-deny">拒绝</button>
      <button class="action-btn primary" id="camera-allow">允许</button>
    </div>
  </div>
</div>

<script>
const siteUrl = 'https://gumingdilian-hub.github.io/mmmm/';

const results = [
  { code: 'CNMD', desc: '我的人格是 cnmd，不服来挨骂！' },
  { code: '67', desc: '我是 67676767676767' },
  { code: 'OMG', desc: '我的人格是乌梅干！' },
  { code: 'FAKE', desc: '我的人格是法克！' },
  { code: 'SHIT', desc: '我的人格是粪便！是拉拉拉的哦' },
  { code: 'BYD', desc: '我的人格是 beyond，黄家驹哭了' },
  { code: 'WTF', desc: '我的人格是 fake 升级版' },
  { code: 'TYPEC', desc: '我的人格是 type c！我来插插你的' },
  { code: 'NOTCH', desc: '我的人格是 no 吃，绝食抗议' },
  { code: 'HIM', desc: '我的人格是黑木大神，除非你是白木' },
  { code: 'PORN', desc: '我的人格是 porn，给我爽爆了' },
  { code: 'ORZ', desc: '我的人格是 orz，天生的奴隶只会乱跪' }
];

const questions = [
  { id: 1, text: '您满 18 周岁了吗？', type: 'choice', options: ['A: Yes', 'B: No'] },
  { id: 2, text: '您会爱上一只羊吗？', type: 'choice', options: ['A: Yes', 'B: No'] },
  { id: 3, text: '您会用舌头舔自己手肘吗？', type: 'choice', options: ['A: Yes', 'B: No'] },
  { id: 4, text: '您知道您为什么还活着吗？', type: 'choice', options: ['A: 知道', 'B: 不知道'] },
  { id: 5, text: '您认为一头大象多重？', type: 'choice', options: ['A: 比牛重', 'B: 大概三吨', 'C: 我不到啊'] },
  { id: 6, text: '您在社交时倾向于热烈奔放还是 AD 钙奶？', type: 'choice', options: ['A: 热烈奔放', 'B: AD 钙奶'] },
  { id: 7, text: '您喜欢女孩还是男孩？', type: 'choice', options: ['A: 女孩', 'B: 男孩'] },
  { id: 8, text: '您喜欢可口可乐还是百事可乐？', type: 'choice', options: ['A: 可口可乐', 'B: 百事可乐'] },
  { id: 9, text: '您喜欢企鹅还是猫咪？', type: 'choice', options: ['A: 企鹅', 'B: 猫咪'] },
  { id: 10, text: '您会自我感动吗？', type: 'choice', options: ['A: Yes', 'B: No'] },
  { id: 11, text: '您会自我安慰吗？', type: 'choice', options: ['A: Yes', 'B: No'] },
  { id: 12, text: '您会自慰吗？', type: 'choice', options: ['A: Yes', 'B: No'] },
  { id: 13, text: '您是人吗？', type: 'choice', options: ['A: 是', 'B: 否'] },
  { id: 14, text: '请用一句话证明你是人类', type: 'input', placeholder: '输入任意内容' },
  { id: 15, text: '您的生理性别是？', type: 'choice', options: ['A: boy', 'B: girl'] },
  { id: 16, text: '您的病理性别是？', type: 'choice', options: ['A: gay', 'B: futa'] },
  { id: 17, text: '咩咩咩？', type: 'choice', options: ['咩咩咩', '咩咩咩咩'] },
  { id: 18, text: '咩咩咩咩？', type: 'choice', options: ['咩咩咩', '咩咩咩咩'] },
  { id: 19, text: '咩咩咩咩咩？', type: 'choice', options: ['咩咩咩', '咩咩咩咩'] },
  { id: 20, text: '咩咩咩咩咩咩？', type: 'choice', options: ['咩咩咩', '咩咩咩咩'] }
];

let currentIndex = 0;
let currentResult = null;
let nextCallback = null;

const contentEl = document.getElementById('content');
const blockPage = document.getElementById('block-page');
const modalOverlay = document.getElementById('modal-overlay');
const modalMessage = document.getElementById('modal-message');
const cameraOverlay = document.getElementById('camera-overlay');
const modalOk = document.getElementById('modal-ok');
const cameraAllow = document.getElementById('camera-allow');
const cameraDeny = document.getElementById('camera-deny');

function showQuestion(index) {
  const q = questions[index];
  if (!q) { showResult(); return; }
  contentEl.innerHTML = '';

  const idxEl = document.createElement('div');
  idxEl.className = 'question-index';
  idxEl.textContent = `问题 ${q.id} / ${questions.length}`;
  contentEl.appendChild(idxEl);

  const textEl = document.createElement('div');
  textEl.className = 'question-text';
  textEl.textContent = q.text;
  contentEl.appendChild(textEl);

  if (q.type === 'input') {
    const inputRow = document.createElement('div');
    inputRow.className = 'input-row';

    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = q.placeholder || '';
    input.id = 'answer-input';

    const btn = document.createElement('button');
    btn.className = 'action-btn primary';
    btn.textContent = '提交';
    btn.addEventListener('click', () => {
      if (input.value.trim() === '') {
        showModal('请输入内容');
        return;
      }
      nextQuestion();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        btn.click();
      }
    });

    inputRow.appendChild(input);
    inputRow.appendChild(btn);
    contentEl.appendChild(inputRow);
    return;
  }

  const optionsContainer = document.createElement('div');
  optionsContainer.className = 'options';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => handleChoice(idx));
    optionsContainer.appendChild(btn);
  });
  contentEl.appendChild(optionsContainer);
}

function handleChoice(optionIndex) {
  // 第1题 yes -> 禁止访问
  if (currentIndex === 0 && optionIndex === 0) {
    showBlocked();
    return;
  }

  // 第2题 yes -> 跳到第17题咩咩段
  if (currentIndex === 1 && optionIndex === 0) {
    currentIndex = 16;
    showQuestion(currentIndex);
    return;
  }

  // 第3题 yes -> 虚假摄像头权限
  if (currentIndex === 2 && optionIndex === 0) {
    showCameraModal(() => nextQuestion());
    return;
  }

  // 第7题女孩/男孩
  if (currentIndex === 6) {
    if (optionIndex === 0) {
      showModal('！？lala？！', () => nextQuestion());
    } else {
      showModal('思想不要太封建，生男生女都一样', () => nextQuestion());
    }
    return;
  }

  nextQuestion();
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= questions.length) {
    showResult();
  } else {
    showQuestion(currentIndex);
  }
}

function showBlocked() {
  document.getElementById('app').classList.add('hidden');
  blockPage.classList.remove('hidden');
}

function showModal(message, callback) {
  modalMessage.textContent = message;
  nextCallback = callback || null;
  modalOverlay.classList.remove('hidden');
}

modalOk.addEventListener('click', () => {
  modalOverlay.classList.add('hidden');
  const cb = nextCallback;
  nextCallback = null;
  if (cb) cb();
});

function showCameraModal(callback) {
  nextCallback = callback || null;
  cameraOverlay.classList.remove('hidden');
}

cameraAllow.addEventListener('click', () => {
  cameraOverlay.classList.add('hidden');
  const cb = nextCallback;
  nextCallback = null;
  if (cb) cb();
});

cameraDeny.addEventListener('click', () => {
  cameraOverlay.classList.add('hidden');
  const cb = nextCallback;
  nextCallback = null;
  if (cb) cb();
});

function showResult() {
  currentResult = results[Math.floor(Math.random() * results.length)];
  contentEl.innerHTML = '';

  const box = document.createElement('div');
  box.className = 'result-box';

  const label = document.createElement('div');
  label.className = 'result-label';
  label.textContent = '您的测试结果：';

  const code = document.createElement('div');
  code.className = 'result-code';
  code.textContent = currentResult.code;

  const shareBtn = document.createElement('button');
  shareBtn.className = 'action-btn primary share-btn';
  shareBtn.textContent = '分享结果';
  shareBtn.addEventListener('click', shareResult);

  box.appendChild(label);
  box.appendChild(code);
  box.appendChild(shareBtn);
  contentEl.appendChild(box);
}

function shareResult() {
  if (!currentResult) return;
  const shareText = `我的MBTI测试结果：${currentResult.code} - ${currentResult.desc} ${siteUrl}`;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(shareText).then(() => {
      showModal('已复制到剪贴板');
    }).catch(() => {
      fallbackCopy(shareText);
    });
  } else {
    fallbackCopy(shareText);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showModal('已复制到剪贴板');
  } catch (e) {
    showModal('复制失败，请手动复制：\n' + text);
  }
  document.body.removeChild(ta);
}

// 初始化
showQuestion(0);
</script>
</body>
</html>
