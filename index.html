        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

            background: #e6e9ed;

            justify-content: center;
            align-items: center;

            width: 680px;
            max-width: 94vw;
            min-height: 420px;
            background: #ffffff;

            background: #0078d7;
            height: 34px;

            align-items: center;
            justify-content: space-between;
            padding: 0 6px 0 14px;
            flex-shrink: 0;
            user-select: none;
        }

        .title-bar .title {
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;

            height: 16px;
            background: #ffffff;

            font-size: 10px;
            line-height: 16px;
            text-align: center;
            color: #0078d7;

            justify-content: center;

            font-size: 14px;

        }

            display: flex;
            flex-direction: column;

            position: relative;

            color: #444;

            color: #fff;
            padding: 0 10px;
            border-radius: 0;
            font-size: 12px;
            font-weight: 600;
            line-height: 24px;
            letter-spacing: 0.3px;

        .progress-area .step-label {

            font-weight: 400;
        }

        .progress-bar-track {
            flex: 1;
            height: 4px;
            background: #d0d0d0;
            margin-left: 6px;
            border-radius: 0;
        }

        .progress-bar-fill {
            height: 100%;
            background: #0078d7;
            width: 0%;

            left: 0;

            height: 100%;

            align-items: center;
            flex-direction: column;

            font-weight: 300;
            color: #0078d7;
            margin-bottom: 16px;

        .overlay .big-text {
            font-size: 28px;
            font-weight: 500;
            color: #1a1a1a;
            text-align: center;

        .overlay .sub-text {

            color: #666;
            margin-top: 10px;
            text-align: center;

        /* ===== 模态对话框（Windows 风格） ===== */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 30;

        }

            box-shadow: 0 6px 28px rgba(0, 0, 0, 0.25);
            width: 440px;
            max-width: 90vw;
            padding: 0;
            display: flex;
            flex-direction: column;
            animation: modalFade 0.12s ease-out;
        }

        @keyframes modalFade {
            from {
                opacity: 0;
                transform: scale(0.97);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

            background: #f0f0f0;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            color: #1a1a1a;
            border-bottom: 1px solid #d0d0d0;

            color: #1a1a1a;
            line-height: 1.6;

            flex-direction: column;

        }

        }

            justify-content: flex-end;
            gap: 10px;
            border-top: 1px solid #eaeaea;
        }

        .modal-footer button {
            padding: 6px 28px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid #c0c0c0;
            background: #f5f5f5;
            color: #1a1a1a;
            cursor: pointer;
            transition: background 0.1s, border-color 0.1s;
            border-radius: 0;
            min-width: 76px;
        }

        .modal-footer button:hover {
            background: #e8e8e8;
        }

        .modal-footer button.primary {
            background: #0078d7;
            border-color: #0078d7;
            color: #ffffff;
        }

        .modal-footer button.primary:hover {
            background: #005a9e;
            border-color: #005a9e;
        }

        .modal-footer button.primary:active {
            background: #00457a;
        }

        .modal-footer button.danger {
            background: #e81123;
            border-color: #e81123;
            color: #ffffff;
        }

        .modal-footer button.danger:hover {
            background: #c00a1a;
        }

        /* ===== 通知 toast ===== */
        .toast {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            color: #f0f0f0;
            padding: 10px 24px;
            font-size: 14px;
            border-radius: 0;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
            display: none;
            z-index: 40;
            white-space: nowrap;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toast.show {
            display: block;
            animation: toastIn 0.2s ease-out;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .content {
                padding: 18px 16px 22px 16px;

            #question-text {

            }
            .options .opt-btn {
                font-size: 14px;
                padding: 7px 16px;

                padding: 16px 18px 14px 18px;

            }
            .modal-footer {

            #result-text {

            }
            #result-text .result-value {

            }
            .title-bar .title {
                font-size: 12px;
            }
            .window-controls span {
                width: 36px;
                font-size: 12px;
            }
        }

        @media (max-width: 400px) {
            .options {
                gap: 6px 8px;
            }
            .options .opt-btn {
                font-size: 13px;
                padding: 6px 12px;
                min-width: 50px;
            }
            .content {
                padding: 14px 10px 18px 10px;
            }
            #question-text {
                font-size: 15px;
            }
        }
    </style>
</head>

            //  工具
            // ============================================================
            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function pickRandom(arr) {
                return arr[Math.floor(Math.random() * arr.length)];
            }

            function getResultText() {
                if (sheepResult) return '咩咩咩';
                const chosen = pickRandom(RESULTS);
                return chosen.text;
            }

            function getShareText() {
                const r = sheepResult ? '咩咩咩' : finalResult;
                return r + ' ' + SITE_URL;
            }

            // ============================================================
            //  Toast
            // ============================================================
            function showToast(msg, duration) {
                duration = duration || 2200;
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(function() {
                    toast.classList.remove('show');
                }, duration);
            }

            // ============================================================
            //  模态对话框
            // ============================================================
            function showModal(icon, title, desc, buttons) {
                return new Promise(function(resolve) {
                    modalIcon.textContent = icon || '⚠';
                    modalTitle.textContent = title || '提示';
                    modalDesc.innerHTML = desc || '';
                    modalFooter.innerHTML = '';
                    buttons.forEach(function(b) {
                        const btn = document.createElement('button');
                        btn.textContent = b.label;
                        if (b.primary) btn.classList.add('primary');
                        if (b.danger) btn.classList.add('danger');
                        btn.addEventListener('click', function() {
                            modalOverlay.classList.remove('show');
                            resolve(b.value);
                        });
                        modalFooter.appendChild(btn);
                    });
                    modalOverlay.classList.add('show');
                });
            }

            function showSimpleModal(icon, title, desc) {
                return showModal(icon, title, desc, [
                    { label: '确定', value: 'ok', primary: true }
                ]);
            }

            // ============================================================
            //  渲染问题
            // ============================================================
            function renderQuestion(index) {
                // 清除之前的选择状态
                const q = QUESTIONS[index];
                if (!q) return;

                // 更新进度
                const displayNum = index + 1;
                stepNum.textContent = displayNum + '/' + TOTAL_QS;
                stepLabel.textContent = '问题';
                const pct = ((index) / TOTAL_QS) * 100;
                progressFill.style.width = pct + '%';

                // 显示问题区，隐藏结果区
                questionArea.style.display = 'flex';
                resultArea.classList.remove('show');

                // 问题文本
                let qText = '<span class="q-number">' + displayNum + '.</span> ' + q.text;
                questionText.innerHTML = qText;

                // 清空选项
                optionsContainer.innerHTML = '';

                if (q.type === 'choice') {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'options';
                    q.options.forEach(function(opt) {
                        const btn = document.createElement('button');
                        btn.className = 'opt-btn';
                        btn.textContent = opt.label;
                        btn.dataset.value = opt.value;
                        btn.addEventListener('click', function() {
                            // 移除其他选中样式
                            optDiv.querySelectorAll('.opt-btn').forEach(b => b.classList.remove(
                            'selected'));
                            btn.classList.add('selected');
                            // 处理选择
                            handleChoice(q.id, opt.value);
                        });
                        optDiv.appendChild(btn);
                    });
                    optionsContainer.appendChild(optDiv);
                } else if (q.type === 'input') {
                    const group = document.createElement('div');
                    group.className = 'input-group';
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.placeholder = q.placeholder || '请输入…';
                    input.id = 'inputField';
                    const confirmBtn = document.createElement('button');
                    confirmBtn.className = 'confirm-btn';
                    confirmBtn.textContent = '确认';
                    confirmBtn.addEventListener('click', function() {
                        const val = input.value.trim();
                        if (val === '') {
                            showToast('请输入内容再确认', 1500);
                            return;
                        }
                        handleInput(q.id, val);
                    });
                    input.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') {
                            confirmBtn.click();
                        }
                    });
                    group.appendChild(input);
                    group.appendChild(confirmBtn);
                    optionsContainer.appendChild(group);
                    // 自动聚焦
                    setTimeout(function() { input.focus(); }, 80);
                }
            }

            // ============================================================
            //  处理选择 / 输入
            // ============================================================
            function handleChoice(qId, value) {
                answers[qId] = value;

                // ----- 特殊逻辑 -----
                // 问题1: 满18岁
                if (qId === 1) {
                    if (value === 'yes') {
                        // 禁止访问
                        isBlocked = true;
                        blockOverlay.classList.add('show');
                        return;
                    } else {
                        // no → 继续
                        goToNext();
                        return;
                    }
                }

                // 问题2: 爱上一只羊
                if (qId === 2) {
                    if (value === 'yes') {
                        // 跳转到结果，显示咩咩咩
                        sheepResult = true;
                        isSheepMode = true;
                        showResult();
                        return;
                    } else {
                        // no → 继续
                        goToNext();
                        return;
                    }
                }

                // 问题3: 舔手肘
                if (qId === 3) {
                    if (value === 'yes') {
                        // 弹出摄像头权限弹窗
                        showCameraModal().then(function() {
                            // 弹窗关闭后继续
                            goToNext();
                        });
                        return;
                    } else {
                        goToNext();
                        return;
                    }
                }

                // 问题7: 喜欢女孩还是男孩
                if (qId === 7) {
                    if (value === '女孩') {
                        showSimpleModal('!', 'lala', '！？lala？！').then(function() {
                            goToNext();
                        });
                        return;
                    } else if (value === '男孩') {
                        showSimpleModal('!', '提示', '思想不要太封建，生男生女都一样').then(function() {
                            goToNext();
                        });
                        return;
                    }
                }

                // 其他普通选择 → 继续
                goToNext();
            }

            function handleInput(qId, value) {
                answers[qId] = value;
                // 问题14 → 继续
                goToNext();
            }

            // ============================================================
            //  摄像头权限弹窗（虚假）
            // ============================================================
            function showCameraModal() {
                return new Promise(function(resolve) {
                    const icon = '📷';
                    const title = '摄像头权限请求';
                    const desc = '是否允许此应用访问您的摄像头？<br><span style="color:#666;font-size:14px;">（这是一个虚假的权限请求，仅供娱乐）</span>';
                    showModal(icon, title, desc, [
                        { label: '允许', value: 'allow', primary: true },
                        { label: '拒绝', value: 'deny' }
                    ]).then(function(result) {
                        if (result === 'allow') {
                            showToast('已允许摄像头访问（开玩笑的）', 1500);
                        } else {
                            showToast('已拒绝摄像头访问', 1200);
                        }
                        resolve();
                    });
                });
            }

            // ============================================================
            //  跳转
            // ============================================================
            function goToNext() {
                if (isBlocked) return;
                if (isSheepMode) return;
                const next = currentIndex + 1;
                if (next >= TOTAL_QS) {
                    // 所有问题完成 → 显示结果
                    showResult();
                } else {
                    currentIndex = next;
                    renderQuestion(currentIndex);
                }
            }

            // ============================================================
            //  显示结果
            // ============================================================
            function showResult() {
                questionArea.style.display = 'none';
                resultArea.classList.add('show');
                progressFill.style.width = '100%';
                stepNum.textContent = '完成';
                stepLabel.textContent = '结果';

                let resultValue = '';
                if (sheepResult) {
                    resultValue = '咩咩咩';
                } else {
                    finalResult = getResultText();
                    resultValue = finalResult;
                }

                // 如果还没有finalResult，设置
                if (!finalResult && !sheepResult) {
                    finalResult = resultValue;
                }

                resultText.innerHTML = '<span class="result-label">你的 MBTI 人格是</span><span class="result-value">' +
                    resultValue + '</span>';
            }

            // ============================================================
            //  重新开始
            // ============================================================
            function resetTest() {
                // 重置状态
                currentIndex = 0;
                answers = {};
                isBlocked = false;
                isSheepMode = false;
                sheepResult = false;
                finalResult = '';
                blockOverlay.classList.remove('show');
                modalOverlay.classList.remove('show');
                toast.classList.remove('show');
                clearTimeout(toastTimer);

                // 隐藏结果，显示问题
                resultArea.classList.remove('show');
                questionArea.style.display = 'flex';
                renderQuestion(0);
            }

            // ============================================================
            //  分享
            // ============================================================
            function handleShare() {
                const shareText = getShareText();
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(shareText).then(function() {
                        showToast('已复制结果与链接！', 1800);
                    }).catch(function() {
                        fallbackCopy(shareText);
                    });
                } else {
                    fallbackCopy(shareText);
                }
            }

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast('已复制结果与链接！', 1800);
                } catch (e) {
                    showToast('复制失败，请手动复制：' + text, 3000);
                }
                document.body.removeChild(ta);
            }

            // ============================================================
            //  初始化
            // ============================================================
            function init() {
                renderQuestion(0);

                shareBtn.addEventListener('click', handleShare);
                restartBtn.addEventListener('click', resetTest);

                // 标题栏按钮（装饰）
                document.querySelector('.window-controls .close').addEventListener('click', function() {
                    if (confirm('确定要关闭吗？')) {
                        document.getElementById('appWindow').style.opacity = '0.3';
                        document.getElementById('appWindow').style.pointerEvents = 'none';
                        showToast('窗口已冻结 (假的)', 2000);
                    }
                });
                document.querySelector('.window-controls .minimize').addEventListener('click', function() {
                    document.getElementById('appWindow').style.transform = 'scale(0.95)';
                    document.getElementById('appWindow').style.opacity = '0.5';
                    setTimeout(function() {
                        document.getElementById('appWindow').style.transform = 'scale(1)';
                        document.getElementById('appWindow').style.opacity = '1';
                    }, 400);
                    showToast('最小化动画 (假的)', 1000);
                });
                document.querySelector('.window-controls .maximize').addEventListener('click', function() {
                    const w = document.getElementById('appWindow');
                    if (w.style.width === '98vw') {
                        w.style.width = '680px';
                        w.style.maxWidth = '94vw';
                        showToast('还原窗口', 800);
                    } else {
                        w.style.width = '98vw';
                        w.style.maxWidth = '98vw';
                        showToast('最大化 (假的)', 800);
                    }
                });
            }

            // 页面加载完成后初始化
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
